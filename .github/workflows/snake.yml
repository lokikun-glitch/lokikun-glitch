# Generates an animated "snake eating your contribution graph" SVG
# and publishes it to the `output` branch, in both light and dark variants.
#
# Setup required: replace lokikun-glitch below with your GitHub
# username. No other changes are needed — the workflow runs on a daily
# schedule, on every push to main, and can be triggered manually.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: lokikun-glitch
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
