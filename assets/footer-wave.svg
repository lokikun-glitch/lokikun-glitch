<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#00E5A0"/>
    </linearGradient>
  </defs>

  <path fill="url(#waveGrad)" fill-opacity="0.15">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0,80 C300,140 900,20 1200,80 L1200,150 L0,150 Z;
        M0,60 C300,10 900,150 1200,60 L1200,150 L0,150 Z;
        M0,80 C300,140 900,20 1200,80 L1200,150 L0,150 Z
      "/>
  </path>

  <path fill="url(#waveGrad)" fill-opacity="0.30">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,110 C400,160 800,60 1200,110 L1200,150 L0,150 Z;
        M0,95 C400,50 800,160 1200,95 L1200,150 L0,150 Z;
        M0,110 C400,160 800,60 1200,110 L1200,150 L0,150 Z
      "/>
  </path>

  <text x="600" y="45" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#c9d1d9">
    Thanks for stopping by — let's build something great.
  </text>
</svg>
